<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="header"> 
            <div> weather </div>
        </div>

        
        <div class="middle">
            <div class="search">
                <input type="search">
                <button>enter</button>
            </div>

            <div class="body">
                <div class="body-left">
                    <div class="body-upper-left">
                        <div class="w-conditions">
                            cloudy
                        </div>
                        <div class="w-temp">
                            60
                        </div>
                        <div class="w-description">
                            lorem ipsum whatever
                        </div>
                        <div class="w-sunrise">
                            sunrise: 13:00:00
                        </div>
                        <div class="w-sunset">
                            sunset: 00:00:00
                        </div>
                    </div>
                    <div class="forecast body-lower-left">
                        <div class="day1-title title">Tomorrow</div>
                        <div class="day1-description description"><img></div>
                        <div class="day2-title title"></div>
                        <div class="day2-description description"><img></div>
                        <div class="day3-title title"></div>
                        <div class="day3-description description"><img></div>
                        <div class="day4-title title"></div>
                        <div class="day4-description description"><img></div>
                        <div class="day5-title title"></div>
                        <div class="day5-description description"><img></div>
                        <div class="day6-title title"></div>
                        <div class="day6-description description"><img></div>
                        <div class="day7-title title"></div>
                        <div class="day7-description description"><img></div>
                    </div>
                </div>
                <div class="body-right">
                    <img src="./images/earth2.png" alt="earth">
                </div>
            </div>
        </div>

        <div class="footer">
            fooooter
        </div>
    </div>

</body>
</html>
